<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ご来場ありがとうございます</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #01030A;
    --primary: #001DA5;   /* メインブルー */
    --teal: #0BA4C8;      /* サブカラー（ティール） */
    --glow: #3E6BFF;
    --ink: #E8EEFF;
    --ink-dim: rgba(232, 238, 255, 0.58);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg-deep);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    overflow-x: hidden;
  }

  body{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 18px;
    position: relative;
  }

  .field{
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(circle at 50% 12%, rgba(0,29,165,0.5), transparent 55%),
      radial-gradient(circle at 88% 88%, rgba(11,164,200,0.16), transparent 50%),
      var(--bg-deep);
    pointer-events: none;
  }

  .hud-grid{
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.10;
    background-image:
      linear-gradient(var(--teal) 1px, transparent 1px),
      linear-gradient(90deg, var(--teal) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at 50% 30%, black 0%, transparent 70%);
    pointer-events: none;
  }

  .scanline{
    position: fixed;
    left: 0; right: 0;
    height: 120px;
    top: -120px;
    z-index: 2;
    background: linear-gradient(180deg, transparent, rgba(11,164,200,0.18), transparent);
    animation: sweep 1.6s ease-out 0.05s 1 forwards;
    pointer-events: none;
  }
  @keyframes sweep{
    0%{ top: -120px; opacity: 0; }
    10%{ opacity: 1; }
    90%{ opacity: 1; }
    100%{ top: 100%; opacity: 0; }
  }

  .frame{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    padding: 36px 26px 32px;
    border: 1px solid rgba(11,164,200,0.32);
    background: linear-gradient(180deg, rgba(0,29,165,0.16), rgba(1,3,10,0.2));
    backdrop-filter: blur(2px);
    opacity: 0;
    animation: frameIn 0.6s ease-out 0.15s forwards;
  }
  @keyframes frameIn{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .corner{
    position: absolute;
    width: 22px;
    height: 22px;
    border: 2px solid var(--teal);
  }
  .corner--tl{ top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .corner--tr{ top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .corner--bl{ bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .corner--br{ bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .card{ text-align: center; }

  /* ▼ロゴ：logo.png を index.html と同じフォルダに置いてください */
  .logo-wrap{
    width: 128px;
    height: 128px;
    margin: 0 auto 20px;
    border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(11,164,200,0.4), 0 0 28px rgba(11,164,200,0.35);
    opacity: 0;
    transform: scale(0.85);
    animation: logoIn 0.6s cubic-bezier(.2,1.2,.4,1) 0.25s forwards;
  }
  .logo-wrap img{
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: block;
  }
  @keyframes logoIn{
    to{ opacity: 1; transform: scale(1); }
  }

  .status-row{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--teal);
    margin-bottom: 10px;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.55s forwards;
  }
  .status-dot{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 8px var(--teal);
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{ opacity: 1; } 50%{ opacity: 0.3; } }

  /* ▼回数：ここを書き換えてください */
  .event-line{
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.04em;
    color: var(--ink);
    margin-bottom: 4px;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.65s forwards;
  }

  /* ▼開催日：ここを書き換えてください */
  .date-line{
    font-family: 'Space Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.04em;
    color: var(--ink-dim);
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.72s forwards;
  }

  /* ▼テーマバッジ：ここを書き換えてください */
  .badge{
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.10em;
    color: var(--bg-deep);
    background: linear-gradient(120deg, var(--teal), var(--glow));
    display: inline-block;
    padding: 8px 20px;
    margin-bottom: 26px;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    opacity: 0;
    transform: scale(0.85);
    animation: badgeIn 0.5s cubic-bezier(.2,1.3,.4,1) 0.85s forwards;
  }
  @keyframes badgeIn{
    to{ opacity: 1; transform: scale(1); }
  }

  /* ▼メインの挨拶文：ここを書き換えてください */
  h1{
    font-size: 26px;
    line-height: 1.5;
    font-weight: 900;
    margin: 0 0 14px;
    letter-spacing: 0.01em;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 1s forwards;
  }
  h1 .accent{
    color: var(--teal);
    text-shadow: 0 0 18px rgba(11,164,200,0.5);
  }

  /* ▼サブメッセージ：ここを書き換えてください */
  p.msg{
    font-size: 14.5px;
    line-height: 1.9;
    color: var(--ink-dim);
    margin: 0 auto 28px;
    max-width: 300px;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 1.15s forwards;
  }

  /* ▼ハッシュタグ：ここを書き換えてください */
  .readout{
    font-family: 'Space Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    color: rgba(232,238,255,0.4);
    border-top: 1px dashed rgba(11,164,200,0.28);
    padding-top: 18px;
    line-height: 1.9;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 1.3s forwards;
  }
  .readout strong{ color: var(--teal); font-weight: 700; }

  @keyframes fadeUp{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .scanline{ display: none; }
    .frame, .logo-wrap, .status-row, .event-line, .date-line, .badge, h1, p.msg, .readout{
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .status-dot{ animation: none; }
  }
</style>
</head>
<body>

  <div class="field"></div>
  <div class="hud-grid"></div>
  <div class="scanline"></div>

  <div class="frame">
    <span class="corner corner--tl"></span>
    <span class="corner corner--tr"></span>
    <span class="corner corner--bl"></span>
    <span class="corner corner--br"></span>

    <div class="card">

      <div class="logo-wrap">
        <img src="logo.png" alt="第45回技大祭ロゴ">
      </div>

      <div class="status-row">
        <span class="status-dot"></span>
        SCAN COMPLETE
      </div>

      <div class="event-line">第45回技大祭</div>
      <div class="date-line">令和8年 9/19（土）・9/20（日）</div>

      <div class="badge">Bluem Up Date</div>

      <h1>ご来場<br><span class="accent">ありがとうございます！</span></h1>

      <p class="msg">
        技大祭へのご来場を確認しました。<br>
        今日という一日が、良い思い出になりますように。
      </p>

      <div class="readout">
        <strong>#技大祭</strong> &nbsp;|&nbsp; <strong>#NUTFES</strong>
      </div>

    </div>
  </div>

</body>
</html>
