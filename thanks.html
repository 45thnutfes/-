<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ご来場ありがとうございます</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #01030A;
    --bg: #050B1A;
    --primary: #001DA5;
    --glow: #3E6BFF;
    --cyan: #4FE3FF;
    --ink: #E8EEFF;
    --ink-dim: rgba(232, 238, 255, 0.58);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg-deep);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    overflow-x: hidden;
  }

  body{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 18px;
    position: relative;
  }

  .field{
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(circle at 50% 15%, rgba(0,29,165,0.45), transparent 55%),
      radial-gradient(circle at 85% 85%, rgba(79,227,255,0.10), transparent 50%),
      var(--bg-deep);
    pointer-events: none;
  }

  .hud-grid{
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.10;
    background-image:
      linear-gradient(var(--cyan) 1px, transparent 1px),
      linear-gradient(90deg, var(--cyan) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at 50% 35%, black 0%, transparent 70%);
    pointer-events: none;
  }

  .scanline{
    position: fixed;
    left: 0; right: 0;
    height: 120px;
    top: -120px;
    z-index: 2;
    background: linear-gradient(180deg, transparent, rgba(79,227,255,0.16), transparent);
    animation: sweep 1.6s ease-out 0.05s 1 forwards;
    pointer-events: none;
  }
  @keyframes sweep{
    0%{ top: -120px; opacity: 0; }
    10%{ opacity: 1; }
    90%{ opacity: 1; }
    100%{ top: 100%; opacity: 0; }
  }

  .frame{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    padding: 40px 26px 32px;
    border: 1px solid rgba(79,227,255,0.28);
    background: linear-gradient(180deg, rgba(0,29,165,0.14), rgba(1,3,10,0.2));
    backdrop-filter: blur(2px);
    opacity: 0;
    animation: frameIn 0.6s ease-out 0.15s forwards;
  }
  @keyframes frameIn{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .corner{
    position: absolute;
    width: 22px;
    height: 22px;
    border: 2px solid var(--cyan);
  }
  .corner--tl{ top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .corner--tr{ top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .corner--bl{ bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .corner--br{ bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .card{ text-align: center; }

  /* ロゴ画像。同じフォルダに logo.png を置けば表示されます。無ければ自動で非表示になります */
  .logo{
    max-width: 120px;
    max-height: 64px;
    width: auto;
    height: auto;
    margin: 0 auto 18px;
    display: block;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.3s forwards;
  }
  .logo[src=""], .logo:not([src]){ display: none; }

  .status-row{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--cyan);
    margin-bottom: 10px;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.5s forwards;
  }
  .status-dot{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{ opacity: 1; } 50%{ opacity: 0.3; } }

  /* イベント名・テーマ行 */
  .event-line{
    font-family: 'Space Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    margin-bottom: 22px;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.6s forwards;
  }
  .event-line strong{ color: var(--ink); font-weight: 700; }

  .badge{
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.14em;
    color: var(--bg-deep);
    background: linear-gradient(120deg, var(--cyan), var(--glow));
    display: inline-block;
    padding: 7px 18px;
    margin-bottom: 24px;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    opacity: 0;
    transform: scale(0.85);
    animation: badgeIn 0.5s cubic-bezier(.2,1.3,.4,1) 0.65s forwards;
  }
  @keyframes badgeIn{
    to{ opacity: 1; transform: scale(1); }
  }

  h1{
    font-size: 27px;
    line-height: 1.5;
    font-weight: 900;
    margin: 0 0 14px;
    letter-spacing: 0.01em;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.8s forwards;
  }
  h1 .accent{
    color: var(--cyan);
    text-shadow: 0 0 18px rgba(79,227,255,0.5);
  }

  p.msg{
    font-size: 14.5px;
    line-height: 1.9;
    color: var(--ink-dim);
    margin: 0 auto 28px;
    max-width: 300px;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 0.95s forwards;
  }

  .readout{
    font-family: 'Space Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    color: rgba(232,238,255,0.4);
    border-top: 1px dashed rgba(79,227,255,0.25);
    padding-top: 18px;
    line-height: 1.9;
    opacity: 0;
    animation: fadeUp 0.6s ease-out 1.1s forwards;
  }
  .readout strong{ color: var(--cyan); font-weight: 700; }

  @keyframes fadeUp{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .scanline{ display: none; }
    .frame, .logo, .status-row, .event-line, .badge, h1, p.msg, .readout{
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .status-dot{ animation: none; }
  }
</style>
</head>
<body>

  <div class="field"></div>
  <div class="hud-grid"></div>
  <div class="scanline"></div>

  <div class="frame">
    <span class="corner corner--tl"></span>
    <span class="corner corner--tr"></span>
    <span class="corner corner--bl"></span>
    <span class="corner corner--br"></span>

    <div class="card">

      <!-- ▼ロゴ：同じフォルダに logo.png（またはlogo.svg）を置いて、src="logo.png" に変更してください -->
      <img class="logo" src="logo.png" alt="技大祭ロゴ" onerror="this.style.display='none'">

      <div class="status-row">
        <span class="status-dot"></span>
        SCAN COMPLETE
      </div>

      <!-- ▼回数・テーマ：ここを書き換えてください -->
      <div class="event-line">
        <strong>第45回技大祭</strong>「Bluem Up Date」
      </div>

      <div class="badge">ACCESS GRANTED</div>

      <!-- ▼メインの挨拶文：ここを書き換えてください -->
      <h1>ご来場<br><span class="accent">ありがとうございます！</span></h1>

      <!-- ▼サブメッセージ：ここを書き換えてください -->
      <p class="msg">
        技大祭へのご来場を確認しました。<br>
        今日という一日が、良い思い出になりますように。
      </p>

      <!-- ▼開催日・ハッシュタグ：ここを書き換えてください -->
      <div class="readout">
        令和8年度 <strong>9/19（土）・9/20（日）</strong><br>
        <strong>#技大祭</strong>
      </div>

    </div>
  </div>

</body>
</html>
